<html>
  <head>
    <title>Min hjemmeside</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico" />
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body>
    <ul class="navbar">
      <p><strong>Menu</strong></p>
      <li><a href="index.html">Frontpage</a></li>
      <li><a href="side2.html">Side 2</a></li>
    </ul>
    <div class="container">
      <h1>Mit navn er Simon</h1>
      <img
        src="selfie.jpg"
        id="me-img" />

      <h2>Ting jeg kan lide</h2>
      <div class="grid">
        <div class="grid-item"><img src="Coding-Pirate-Logo-512px.png" /></div>
        <div class="grid-item"><img src="switch.jpg" /></div>
        <div class="grid-item"><img src="anime.jpg" /></div>
      </div>
    </div>
    <script>
      const mePicture = document.getElementById('me-img');
      mePicture.addEventListener('click', function (event) {
        if (mePicture.className === 'animation') {
          mePicture.className = 'animation-reverse';
        } else {
          mePicture.className = 'animation';
        }
      });
    </script>
  </body>
</html>
